name: Apple branding audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      ASC_APP_ID: "6771258872"
      ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install asc CLI
        run: |
          set -euo pipefail
          version=5.7.0
          tool_dir="$RUNNER_TEMP/asc-cli"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          base="https://github.com/rorkai/App-Store-Connect-CLI/releases/download/$version"
          binary="asc_${version}_macOS_arm64"
          curl --fail --location --silent --show-error "$base/$binary" -o "$binary"
          curl --fail --location --silent --show-error "$base/asc_${version}_checksums.txt" -o checksums.txt
          awk -v binary="$binary" '$2 == binary { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          shasum -a 256 -c selected-checksum.txt
          mv "$binary" asc
          chmod +x asc
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Prepare App Store Connect authentication
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ASC_API_KEY_ID"
          test -n "$ASC_API_ISSUER_ID"
          test -n "$ASC_API_PRIVATE_KEY"
          printf '%s\n' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_API_PRIVATE_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Sync Setzo name and Apple metadata
        run: |
          asc auth login --name setzo \
            --key-id "$ASC_API_KEY_ID" \
            --issuer-id "$ASC_API_ISSUER_ID" \
            --private-key "$ASC_API_PRIVATE_KEY_PATH" > /dev/null
          python3 scripts/sync_apple_branding.py


      - name: Audit store assets and refresh TestFlight notes
        run: python3 scripts/audit_apple_branding.py
      - name: Save public branding report
        uses: actions/upload-artifact@v4
        with:
          name: apple-branding-audit
          path: build/apple-branding-audit.json
