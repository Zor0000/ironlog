name: Supabase Keep-Alive

on:
  schedule:
    # Every 6 hours. Supabase pauses a free project that lacks "sufficient user
    # database activity", and their docs put the bar at "a few user requests to
    # the database each day" — one ping a day cleared zero but not that bar, and
    # the project got flagged anyway. Four runs also mean a delayed or dropped
    # GitHub schedule costs one slot, not the whole day.
    # Minute 17, not :00, because GitHub queues top-of-hour jobs behind everyone
    # else's and drops them under load.
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoints
        env:
          SUPABASE_URL: https://dvqevdydldxjqjrpkkjc.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2cWV2ZHlkbGR4anFqcnBra2pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzE3NDQsImV4cCI6MjA4ODA0Nzc0NH0.HrLewQwabuPNeD-8BZu4Muxju_4IDcJ3FuNhfwWm3t0
        run: |
          set -e
          # Several tables per run, so a run is "a few requests" rather than one.
          # RLS returns [] to anon, which is fine — the query still executes in
          # Postgres, and executing is what the pause heuristic counts.
          for table in exercises sessions routines; do
            # Retry to ride out transient DNS/5xx blips (a paused project fails DNS).
            code=$(curl -s -o /tmp/body -w "%{http_code}" \
              --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1")
            echo "$table -> HTTP $code $(cat /tmp/body)"
            # Fail loudly on 404/401: a renamed table or rotated key would
            # otherwise keep "succeeding" while pinging nothing.
            test "$code" = "200"
          done
