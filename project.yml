name: IronLog
options:
  bundleIdPrefix: com.parthjadhav
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 3
    DEVELOPMENT_TEAM: 75LRT8TRQY
# NOTE: IronLog.xcodeproj is committed and authoritative (XcodeGen is not run at
# checkout). Keep this file in sync when adding targets, but the .xcodeproj wins.
targets:
  IronLog:
    type: application
    platform: iOS
    sources:
      - path: IronLog
    resources:
      - path: IronLog/Resources
    dependencies:
      - target: IronLogWidgetExtension
    settings:
      base:
        BASE_BUNDLE_ID: com.parthjadhav.ironlog
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        INFOPLIST_FILE: IronLog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
      # Debug stays automatic so day-to-day work on a device needs no setup.
      # Release is pinned so a CI archive can never mint a signing certificate:
      # scripts/install_provisioning_profiles.sh puts this profile in place, and
      # a missing one fails the build instead of asking Apple for another.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: IronLog App Store
    scheme:
      testTargets:
        - IronLogTests
        - IronLogUITests
  # Lock-screen / Dynamic Island Live Activity for logging sets without unlocking.
  # The four shared Live/* files are compiled into both the app and this extension;
  # AppState+LiveActivity.swift stays app-only (it references AppState).
  IronLogWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: IronLogWidget
      - path: IronLog/Live/LiveWorkoutModels.swift
      - path: IronLog/Live/WorkoutActivityAttributes.swift
      - path: IronLog/Live/LiveWorkoutEngine.swift
      - path: IronLog/Live/WorkoutLiveActivityIntents.swift
    settings:
      base:
        BASE_BUNDLE_ID: com.parthjadhav.ironlog
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).IronLogWidget
        INFOPLIST_FILE: IronLogWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: IronLog Widget App Store
  IronLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IronLogTests
    dependencies:
      - target: IronLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parthjadhav.ironlog.tests
        GENERATE_INFOPLIST_FILE: YES
  IronLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IronLogUITests
    dependencies:
      - target: IronLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parthjadhav.ironlog.uitests
        GENERATE_INFOPLIST_FILE: YES
