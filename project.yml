name: Setzo
options:
  bundleIdPrefix: com.parthjadhav
  deploymentTarget:
    iOS: "17.0"
packages:
  Liveline:
    url: https://github.com/ParthJadhav/liveline-swift.git
    from: 0.7.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.2
settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 3
    DEVELOPMENT_TEAM: 75LRT8TRQY
# NOTE: Setzo.xcodeproj is committed and authoritative (XcodeGen is not run at
# checkout). Keep this file in sync when adding targets, but the .xcodeproj wins.
targets:
  Setzo:
    type: application
    platform: iOS
    sources:
      - path: Setzo
    resources:
      - path: Setzo/Resources
    dependencies:
      - target: SetzoWidgetExtension
      - package: Liveline
      - package: Supabase
    settings:
      base:
        BASE_BUNDLE_ID: com.parthjadhav.ironlog
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        INFOPLIST_FILE: Setzo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
      # Debug stays automatic so day-to-day work on a device needs no setup.
      # Release is pinned so a CI archive can never mint a signing certificate:
      # scripts/install_provisioning_profiles.sh puts this profile in place, and
      # a missing one fails the build instead of asking Apple for another.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Setzo App Store
    scheme:
      testTargets:
        - SetzoTests
        - SetzoUITests
  # Lock-screen / Dynamic Island Live Activity for logging sets without unlocking.
  # The four shared Live/* files are compiled into both the app and this extension;
  # AppState+LiveActivity.swift stays app-only (it references AppState).
  SetzoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SetzoWidget
      - path: Setzo/Live/LiveWorkoutModels.swift
      - path: Setzo/Live/WorkoutActivityAttributes.swift
      - path: Setzo/Live/LiveWorkoutEngine.swift
      - path: Setzo/Live/WorkoutLiveActivityIntents.swift
    resources:
      - path: SetzoWidget/PrivacyInfo.xcprivacy
    settings:
      base:
        BASE_BUNDLE_ID: com.parthjadhav.ironlog
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).IronLogWidget
        INFOPLIST_FILE: SetzoWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Setzo Widget App Store
  SetzoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SetzoTests
    dependencies:
      - target: Setzo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parthjadhav.setzo.tests
        GENERATE_INFOPLIST_FILE: YES
  SetzoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SetzoUITests
    dependencies:
      - target: Setzo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parthjadhav.setzo.uitests
        GENERATE_INFOPLIST_FILE: YES
